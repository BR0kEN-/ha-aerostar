[project]
name = "ha-aerostar"
version = "0.1.0"
description = "Home Assistant custom component: Aerostar"
readme = "README.md"
requires-python = ">=3.13.2"
authors = [{ name = "Sergii Bondarenko", email = "sb@firstvector.org" }]
dependencies = [
    "homeassistant>=2026.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-homeassistant-custom-component>=0.13.368",
    "ruff>=0.16.10",
]

[tool.setuptools]
packages = [
    "custom_components",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "D203",    # no-blank-line-before-class (incompatible with formatter)
    "D212",    # multi-line-summary-first-line (incompatible with formatter)
    "COM812",  # incompatible with formatter
    "ISC001",  # incompatible with formatter
    "TD002",   # todo require author tag
    "TD003",   # todo should have a link to an issue
    "FIX002",  # require todo to be resolved
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of assert detected
    "PLR2004", # Magic value used in comparison
    "ANN",     # Missing type annotations
    "SLF001",  # Private member access (needed for testing)
    "D",       # Docstring requirements
    "DTZ001",  # Datetime without timezone (tests use naive datetimes)
    "ERA001",  # Commented-out code (test comments are explanatory)
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
